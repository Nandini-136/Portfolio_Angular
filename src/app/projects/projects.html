<section id="projects" class="projects">

  <h2>
    <i class="fas fa-laptop-code"></i>
    Projects <span>Made</span>
  </h2>

  <div class="projects-grid">

    <div
      class="project-card"
      *ngFor="let project of projects">

      <img
        [src]="project.image"
        [alt]="project.title">

      <div class="overlay">

        <h3>{{project.title}}</h3>

        <p>
          {{project.description}}
        </p>

        <div class="buttons">

          <a
            [href]="project.github"
            target="_blank"
            class="btn">
            View
          </a>

          <a
            [href]="project.github"
            target="_blank"
            class="btn">
            Code
          </a>

        </div>

      </div>

      <div class="title">
        {{project.title}}
      </div>

    </div>

  </div>

</section>
