<section id="contact" class="contact">

  <h2>
    <i class="fas fa-headset"></i>
    Get In <span>Touch</span>
  </h2>

  <div class="contact-container">

    <div class="contact-image">
      <img
        src="images/contact.png"
        alt="Contact">
    </div>

    <form
      class="contact-form"
      (ngSubmit)="submitForm()">

      <div class="input-box">
        <i class="fas fa-user"></i>
        <input
          type="text"
          placeholder="Name"
          [(ngModel)]="name"
          name="name">
      </div>

      <div class="input-box">
        <i class="fas fa-envelope"></i>
        <input
          type="email"
          placeholder="Email"
          [(ngModel)]="email"
          name="email">
      </div>

      <div class="input-box">
        <i class="fas fa-phone"></i>
        <input
          type="text"
          placeholder="Phone"
          [(ngModel)]="phone"
          name="phone">
      </div>

      <div class="input-box textarea">
        <i class="fas fa-comment"></i>
        <textarea
          rows="6"
          placeholder="Message"
          [(ngModel)]="message"
          name="message">
        </textarea>
      </div>

      <button type="submit">
        Submit
        <i class="fas fa-paper-plane"></i>
      </button>

    </form>

  </div>

</section>
